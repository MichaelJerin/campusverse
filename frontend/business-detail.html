<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVerse — Business Details</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="page-shell" style="max-width: 720px;">

    <div id="viewMode">
        <div id="businessCard" class="card" style="margin-bottom: 24px;"></div>
    </div>

    <div id="editMode" class="card" style="display:none; margin-bottom: 24px;">
        <h3 style="margin-bottom:16px;">Edit Listing</h3>
        <div id="editError" class="alert alert-error" style="display:none;"></div>
        <form id="editForm">
            <div class="field-row">
                <div class="field">
                    <label for="editName">Name</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="field">
                    <label for="editCategory">Category</label>
                    <input type="text" id="editCategory" required>
                </div>
            </div>
            <div class="field">
                <label for="editDescription">Description</label>
                <textarea id="editDescription"></textarea>
            </div>
            <div class="field-row">
                <div class="field">
                    <label for="editAddress">Address</label>
                    <input type="text" id="editAddress" required>
                </div>
                <div class="field">
                    <label for="editTags">Tags</label>
                    <input type="text" id="editTags">
                </div>
                <div class="field">
                    <label for="editMapLink">Google Maps Link</label>
                    <input type="url" id="editMapLink">
                </div>
            </div>
            <div style="display:flex; gap:10px;">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <button type="button" class="btn btn-secondary" onclick="cancelEdit()">Cancel</button>
            </div>
        </form>
    </div>

    <div class="card" style="margin-bottom: 24px;">
        <h3 style="margin-bottom:16px;">Leave a Review</h3>
        <div id="reviewError" class="alert alert-error" style="display:none;"></div>
        <form id="reviewForm">
            <div class="field">
                <label for="rating">Rating (1–5)</label>
                <input type="number" id="rating" min="1" max="5" required>
            </div>
            <div class="field">
                <label for="comment">Comment</label>
                <textarea id="comment" placeholder="How was it?"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Submit Review</button>
        </form>
    </div>

    <div class="card">
        <h3 class="section-title" style="font-size:19px;">Reviews</h3>
        <div id="reviewsList"></div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/business-detail.js"></script>
</body>
</html>
