<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVerse — Lost & Found</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="page-shell">
    <h1 class="page-title">Lost & Found</h1>
    <p class="page-subtitle" style="margin-bottom: 32px;">Report a found item, or search for something you've lost.</p>

    <div class="card" style="margin-bottom: 32px;">
        <h3 style="margin-bottom: 20px;">Report a Found Item</h3>
        <div id="postError" class="alert alert-error" style="display:none;"></div>
        <form id="postItemForm">
            <div class="field-row">
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Blue Water Bottle" required>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="e.g. Accessories">
                </div>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Any distinguishing details"></textarea>
            </div>
            <div class="field-row" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="field">
                    <label for="location">Location Found</label>
                    <input type="text" id="location" required>
                </div>
                <div class="field">
                    <label for="contactNumber">Contact Number</label>
                    <input type="text" id="contactNumber" required>
                </div>
                <div class="field">
                    <label for="eventDate">Date Found</label>
                    <input type="date" id="eventDate">
                </div>
            </div>
            <button type="submit" class="btn btn-success">Post Item</button>
        </form>
    </div>

    <div class="search-bar">
        <div class="field" style="margin-bottom:0;">
            <input type="text" id="searchKeyword" placeholder="Keyword">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="text" id="searchLocation" placeholder="Location">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="text" id="searchCategory" placeholder="Category">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="date" id="searchDate">
        </div>
        <button class="btn btn-secondary" onclick="loadItems()">Search</button>
    </div>

    <div id="itemsList" class="items-grid"></div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/items.js"></script>
</body>
</html>
