<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusVerse — Marketplace</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar"></div>

<div class="page-shell">
    <h1 class="page-title">Marketplace</h1>
    <p class="page-subtitle" style="margin-bottom: 32px;">Buy, sell, or exchange used items with other students.</p>

    <div class="card" style="margin-bottom: 32px;">
        <h3 style="margin-bottom: 20px;">List an Item</h3>
        <div id="postError" class="alert alert-error" style="display:none;"></div>
        <form id="postListingForm">
            <div class="field-row">
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" placeholder="e.g. Data Structures Textbook" required>
                </div>
                <div class="field">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="e.g. books, electronics, cycles" required>
                </div>
            </div>
            <div class="field">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Condition details, edition, etc."></textarea>
            </div>
            <div class="field-row" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="field">
                    <label for="listingType">Type</label>
                    <select id="listingType">
                        <option value="SELL">Sell</option>
                        <option value="EXCHANGE">Exchange</option>
                        <option value="EITHER">Either</option>
                    </select>
                </div>
                <div class="field">
                    <label for="condition">Condition</label>
                    <select id="condition">
                        <option value="NEW">New</option>
                        <option value="LIKE_NEW">Like New</option>
                        <option value="USED">Used</option>
                        <option value="WORN">Worn</option>
                    </select>
                </div>
                <div class="field" id="priceField">
                    <label for="price">Price (₹)</label>
                    <input type="number" id="price" min="0" step="0.01">
                </div>
            </div>
            <button type="submit" class="btn btn-success">Post Listing</button>
        </form>
    </div>

    <div class="search-bar" style="grid-template-columns: 2fr 1fr 1fr 1fr auto;">
        <div class="field" style="margin-bottom:0;">
            <input type="text" id="searchKeyword" placeholder="Search by title or description">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="text" id="searchCategory" placeholder="Category">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="number" id="minPrice" placeholder="Min ₹">
        </div>
        <div class="field" style="margin-bottom:0;">
            <input type="number" id="maxPrice" placeholder="Max ₹">
        </div>
        <button class="btn btn-primary" onclick="loadListings()">Search</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="tabBrowse" onclick="switchTab('browse')">Browse</button>
        <button class="tab-btn" id="tabMine" onclick="switchTab('mine')">My Listings</button>
    </div>

    <div id="listingsList" class="items-grid"></div>
</div>

<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/listings.js"></script>
</body>
</html>
